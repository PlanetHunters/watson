[tox]
envlist = py{311}
requires = tox-conda

[pytest]
markers =
    integration: tests that require MAST, TRILEGAL, TPF downloads, or external services

[testenv]
conda_channels =
    conda-forge
conda_create_args =
    --override-channels
setenv =
    PYTHONUNBUFFERED = 1
    MPLBACKEND = Agg
deps=
    pip
    wheel
    setuptools<71
    pytest
    Cython
    numpy==2.1.1
    pytest-forked
    pytest-xdist
whitelist_externals = pytest
    /bin/rm
commands =
    pytest -s --log-cli-level=INFO --log-cli-format="%(levelname)-8s [%(name)s] %(message)s" --forked -n 1 -v -x -m "not integration" watson/tests/

[gh]
python =
    3.11 = py311, type
allowlist_externals = rm
